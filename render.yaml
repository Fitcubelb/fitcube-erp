# Render "Blueprint" — lets you deploy by pointing Render at this repo
# instead of clicking through the manual setup. See README.md for both
# options. Free web service: no persistent disk, so the database lives in
# Turso (also free) instead of the local SQLite file.
services:
  - type: web
    name: fitcube-erp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Skips whatsapp-web.js's own Chromium download at install time — the
      # optional automation below (WHATSAPP_WEB_AUTOMATION) supplies its own
      # via @sparticuz/chromium instead, which is far more likely to actually
      # launch on Render's free plan. Harmless to leave set even if that
      # feature is never turned on.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      # Optional, free (unofficial, ToS-risk) WhatsApp automation — see
      # README.md "WhatsApp reminders". Leave unset/false to not use it at
      # all; the app works exactly the same either way.
      - key: WHATSAPP_WEB_AUTOMATION
        value: "false"
